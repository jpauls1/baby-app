<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Baby Play">
  <title>Baby Play</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    /* ── Canvas ── */
    #canvas {
      display: block;
      width: 100%; height: 100%;
      position: fixed;
      top: 0; left: 0;
    }

    /* ── Piano view ── */
    #piano-view {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #111;
      align-items: center;
      justify-content: center;
    }
    #piano-view.active { display: flex; }

    #piano {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
      padding: 0 10px;
      height: 58vh;
    }

    .white-key {
      flex: 1;
      height: 100%;
      background: #f0f0f0;
      border: 2px solid #444;
      border-radius: 0 0 12px 12px;
      margin: 0 3px;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 16px;
      transition: background 0.04s, box-shadow 0.04s;
    }

    .white-key .note-label {
      font-size: 15px;
      font-weight: 700;
      color: rgba(0,0,0,0.3);
      font-family: 'Helvetica Neue', sans-serif;
      pointer-events: none;
    }

    /* ── Animals view ── */
    #animals-view {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #111;
      align-items: center;
      justify-content: center;
    }
    #animals-view.active { display: flex; }

    .animal-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
      height: 100%;
      padding: calc(env(safe-area-inset-top) + 74px) 16px 24px;
    }

    @media (max-width: 600px) {
      .animal-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(4, 1fr);
      }
    }

    .animal-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.06);
      border: 3px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      cursor: pointer;
      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        background 0.12s ease,
        border-color 0.12s ease;
    }

    .animal-card .emoji {
      font-size: clamp(44px, 11vw, 100px);
      line-height: 1;
      pointer-events: none;
    }

    .animal-card .name {
      margin-top: 8px;
      font-family: 'Helvetica Neue', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      pointer-events: none;
    }

    .animal-card.active {
      transform: scale(1.08);
      background: var(--card-color);
      border-color: #fff;
      box-shadow: 0 0 40px var(--card-color), 0 0 15px var(--card-color);
    }
    .animal-card.active .name { color: rgba(255,255,255,0.9); }

    /* ── Menu button ── */
    #menu-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 10px);
      right: 16px;
      z-index: 1000;
      width: 46px; height: 46px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 22px;
      color: #fff;
    }

    /* ── Dropdown ── */
    #menu-dropdown {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 64px);
      right: 16px;
      z-index: 1000;
      background: rgba(25,25,25,0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      overflow: hidden;
      display: none;
      min-width: 175px;
    }
    #menu-dropdown.open { display: block; }

    .menu-item {
      padding: 15px 20px;
      color: #fff;
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:active { background: rgba(255,255,255,0.1); }
    .menu-item.selected { color: #FFD700; }
    .menu-item .icon { font-size: 18px; }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div id="piano-view">
    <div id="piano"></div>
  </div>

  <div id="animals-view">
    <div id="animal-grid" class="animal-grid"></div>
  </div>

  <div id="menu-btn">☰</div>

  <div id="menu-dropdown">
    <div class="menu-item selected" data-view="splash">
      <span class="icon">🎨</span> Color Splash
    </div>
    <div class="menu-item" data-view="piano">
      <span class="icon">🎹</span> Piano
    </div>
    <div class="menu-item" data-view="animals">
      <span class="icon">🐾</span> Animals
    </div>
  </div>

  <script>
  // ════════════════════════════════════════
  //  MENU
  // ════════════════════════════════════════
  const menuBtn = document.getElementById('menu-btn');
  const menuDropdown = document.getElementById('menu-dropdown');
  let currentView = 'splash';

  menuBtn.addEventListener('click', e => {
    e.stopPropagation();
    menuDropdown.classList.toggle('open');
  });

  // Close dropdown on tap outside
  document.addEventListener('touchstart', e => {
    if (!menuBtn.contains(e.target) && !menuDropdown.contains(e.target)) {
      menuDropdown.classList.remove('open');
    }
  }, { passive: true });

  document.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('click', () => {
      switchView(item.dataset.view);
      menuDropdown.classList.remove('open');
      document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('selected'));
      item.classList.add('selected');
    });
  });

  function switchView(view) {
    currentView = view;
    const pianoView = document.getElementById('piano-view');
    const animalsView = document.getElementById('animals-view');
    const splashCanvas = document.getElementById('canvas');
    splashCanvas.style.display = view === 'splash' ? 'block' : 'none';
    pianoView.classList.toggle('active', view === 'piano');
    animalsView.classList.toggle('active', view === 'animals');
  }


  // ════════════════════════════════════════
  //  COLOR SPLASH
  // ════════════════════════════════════════
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let canvasW, canvasH;

  function resize() {
    canvasW = canvas.width = window.innerWidth;
    canvasH = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COLORS = [
    '#FF3366', '#FF6B35', '#FFD700', '#00FF88',
    '#00CFFF', '#7B2FFF', '#FF2FD4', '#FF8C00',
    '#39FF14', '#FF073A', '#0FF0FC', '#FF6EC7',
  ];
  function randColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

  class Stream {
    constructor() { this.reset(true); }

    reset(init = false) {
      this.x = Math.random() * canvasW;
      this.y = init ? Math.random() * canvasH : (Math.random() < 0.5 ? -20 : canvasH + 20);
      this.vx = (Math.random() - 0.5) * 1.5;
      this.vy = (Math.random() - 0.5) * 1.5;
      if (Math.abs(this.vy) < 0.3) this.vy = 0.3 * Math.sign(this.vy || 1);
      this.color = randColor();
      this.width = 3 + Math.random() * 8;
      this.length = 80 + Math.random() * 200;
      this.alpha = 0.4 + Math.random() * 0.5;
      this.history = [];
      this.maxHistory = Math.floor(this.length / 2);
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = 0.02 + Math.random() * 0.03;
      this.wobbleAmp = 0.3 + Math.random() * 0.8;
    }

    update() {
      this.wobble += this.wobbleSpeed;
      this.vx += Math.sin(this.wobble) * this.wobbleAmp * 0.05;
      this.vy += Math.cos(this.wobble * 0.7) * this.wobbleAmp * 0.05;
      const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      if (spd > 2.5) {
        this.vx *= 2.5 / spd;
        this.vy *= 2.5 / spd;
      }
      this.x += this.vx;
      this.y += this.vy;
      this.history.push({ x: this.x, y: this.y });
      if (this.history.length > this.maxHistory) this.history.shift();
      const isOutOfBounds = this.x < -200 || this.x > canvasW + 200
        || this.y < -200 || this.y > canvasH + 200;
      if (isOutOfBounds) this.reset();
    }

    draw() {
      if (this.history.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(this.history[0].x, this.history[0].y);
      for (let i = 1; i < this.history.length; i++) {
        ctx.lineTo(this.history[i].x, this.history[i].y);
      }
      ctx.strokeStyle = this.color;
      ctx.lineWidth = this.width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.globalAlpha = this.alpha;
      ctx.shadowColor = this.color;
      ctx.shadowBlur = this.width * 2;
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }
  }

  class Particle {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 5;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.color = color;
      this.alpha = 1;
      this.size = 2 + Math.random() * 6;
      this.decay = 0.015 + Math.random() * 0.025;
      this.gravity = 0.15 + Math.random() * 0.1;
      this.shape = Math.random() < 0.5 ? 'circle' : 'star';
    }

    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += this.gravity;
      this.vx *= 0.98;
      this.alpha -= this.decay;
      this.size *= 0.99;
    }

    draw() {
      ctx.globalAlpha = Math.max(0, this.alpha);
      ctx.fillStyle = this.color;
      if (this.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      } else {
        drawStar(ctx, this.x, this.y, 5, this.size, this.size * 0.45);
      }
      ctx.globalAlpha = 1;
    }

    dead() { return this.alpha <= 0; }
  }

  class Ring {
    constructor(x, y, color) {
      this.x = x;
      this.y = y;
      this.color = color;
      this.radius = 10;
      this.maxRadius = 80 + Math.random() * 100;
      this.alpha = 0.8;
      this.width = 3 + Math.random() * 4;
    }

    update() {
      this.radius += (this.maxRadius - this.radius) * 0.12;
      this.alpha -= 0.025;
    }

    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.strokeStyle = this.color;
      ctx.lineWidth = this.width;
      ctx.globalAlpha = Math.max(0, this.alpha);
      ctx.shadowColor = this.color;
      ctx.shadowBlur = 15;
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    dead() { return this.alpha <= 0; }
  }

  function drawStar(context, cx, cy, spikes, outerR, innerR) {
    let rot = (Math.PI / 2) * 3;
    const step = Math.PI / spikes;
    context.beginPath();
    context.moveTo(cx, cy - outerR);
    for (let i = 0; i < spikes; i++) {
      context.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
      rot += step;
      context.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
      rot += step;
    }
    context.lineTo(cx, cy - outerR);
    context.closePath();
    context.fill();
  }

  const streams = Array.from({ length: 18 }, () => new Stream());
  let particles = [];
  let rings = [];

  function burst(x, y) {
    const color = randColor();
    const count = 12 + Math.floor(Math.random() * 8);
    for (let i = 0; i < count; i++) {
      const particleColor = i % 3 === 0 ? randColor() : color;
      particles.push(new Particle(x, y, particleColor));
    }
    const numRings = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < numRings; i++) {
      rings.push(new Ring(x, y, i === 0 ? color : randColor()));
    }
  }

  function handleSplashTouch(e) {
    if (currentView !== 'splash') return;
    e.preventDefault();
    const touches = e.changedTouches || [e];
    for (const t of touches) {
      const rect = canvas.getBoundingClientRect();
      // Don't burst if touching the menu area
      if (t.clientX > canvasW - 80 && t.clientY < 80) return;
      burst(t.clientX - rect.left, t.clientY - rect.top);
    }
  }

  canvas.addEventListener('touchstart', handleSplashTouch, { passive: false });
  canvas.addEventListener('touchmove', handleSplashTouch, { passive: false });
  canvas.addEventListener('mousedown', handleSplashTouch);
  canvas.addEventListener('mousemove', e => { if (e.buttons) handleSplashTouch(e); });

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  function loop() {
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(0, 0, canvasW, canvasH);
    for (const s of streams) {
      s.update();
      s.draw();
    }
    rings = rings.filter(r => !r.dead());
    for (const r of rings) {
      r.update();
      r.draw();
    }
    particles = particles.filter(p => !p.dead());
    for (const p of particles) {
      p.update();
      p.draw();
    }
    requestAnimationFrame(loop);
  }
  loop();


  // ════════════════════════════════════════
  //  PIANO
  // ════════════════════════════════════════

  // C D E F G A B C  (one octave)
  const NOTES = [
    { label: 'C', freq: 261.63, color: '#FF3366' },
    { label: 'D', freq: 293.66, color: '#FF8C00' },
    { label: 'E', freq: 329.63, color: '#FFD700' },
    { label: 'F', freq: 349.23, color: '#00FF88' },
    { label: 'G', freq: 392.00, color: '#00CFFF' },
    { label: 'A', freq: 440.00, color: '#7B2FFF' },
    { label: 'B', freq: 493.88, color: '#FF2FD4' },
    { label: 'C', freq: 523.25, color: '#FF3366' },
  ];

  // iOS requires AudioContext creation AND resume inside a direct user gesture
  let audioCtx = null;

  function getAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // Unlock audio on first touch anywhere on the piano view
  document.getElementById('piano-view').addEventListener('pointerdown', () => {
    getAudio();
  }, { once: false });

  // Active notes: pointerId → { osc, gain }
  const activeNotes = new Map();

  function playNote(freq, id) {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, ac.currentTime);
    gain.gain.setValueAtTime(0, ac.currentTime);
    gain.gain.linearRampToValueAtTime(0.7, ac.currentTime + 0.02);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start();
    activeNotes.set(id, { osc, gain });
  }

  function stopNote(id) {
    const entry = activeNotes.get(id);
    if (!entry) return;
    const { osc, gain } = entry;
    const ac = getAudio();
    gain.gain.setValueAtTime(gain.gain.value, ac.currentTime);
    gain.gain.linearRampToValueAtTime(0, ac.currentTime + 0.18);
    osc.stop(ac.currentTime + 0.18);
    activeNotes.delete(id);
  }

  // Build keys
  const pianoEl = document.getElementById('piano');
  NOTES.forEach((n, i) => {
    const key = document.createElement('div');
    key.className = 'white-key';
    key.dataset.index = i;
    key.innerHTML = `<span class="note-label">${n.label}</span>`;
    pianoEl.appendChild(key);
  });

  // Track which key each pointer is currently pressing
  const pointerKeys = new Map();

  function keyDown(keyEl, pointerId) {
    if (pointerKeys.has(pointerId) && pointerKeys.get(pointerId) === keyEl) return;
    keyUp(pointerId); // release previous if sliding
    const i = parseInt(keyEl.dataset.index);
    const n = NOTES[i];
    keyEl.style.background = n.color;
    keyEl.style.boxShadow = `0 0 30px ${n.color}, 0 0 10px ${n.color}`;
    keyEl.querySelector('.note-label').style.color = 'rgba(255,255,255,0.7)';
    playNote(n.freq, pointerId);
    pointerKeys.set(pointerId, keyEl);
  }

  function keyUp(pointerId) {
    const keyEl = pointerKeys.get(pointerId);
    if (!keyEl) return;
    keyEl.style.background = '';
    keyEl.style.boxShadow = '';
    keyEl.querySelector('.note-label').style.color = '';
    stopNote(pointerId);
    pointerKeys.delete(pointerId);
  }

  pianoEl.addEventListener('pointerdown', e => {
    e.preventDefault();
    const key = e.target.closest('.white-key');
    if (!key) return;
    pianoEl.setPointerCapture(e.pointerId);
    keyDown(key, e.pointerId);
  });

  pianoEl.addEventListener('pointermove', e => {
    e.preventDefault();
    if (!pointerKeys.has(e.pointerId)) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const key = el && el.closest('.white-key');
    if (key && key !== pointerKeys.get(e.pointerId)) {
      keyDown(key, e.pointerId);
    }
  });

  pianoEl.addEventListener('pointerup', e => keyUp(e.pointerId));
  pianoEl.addEventListener('pointercancel', e => keyUp(e.pointerId));


  // ════════════════════════════════════════
  //  ANIMALS
  // ════════════════════════════════════════
  const ANIMALS = [
    { emoji: '🐄', name: 'Cow',   file: 'sounds/cow.mp3',   color: '#FF3366' },
    { emoji: '🐶', name: 'Dog',   file: 'sounds/dog.mp3',   color: '#FF8C00' },
    { emoji: '🐱', name: 'Cat',   file: 'sounds/cat.mp3',   color: '#FFD700' },
    { emoji: '🐷', name: 'Pig',   file: 'sounds/pig.mp3',   color: '#00FF88' },
    { emoji: '🦆', name: 'Duck',  file: 'sounds/duck.mp3',  color: '#00CFFF' },
    { emoji: '🦁', name: 'Lion',  file: 'sounds/lion.mp3',  color: '#7B2FFF' },
    { emoji: '🐴', name: 'Horse', file: 'sounds/horse.mp3', color: '#FF2FD4' },
    { emoji: '🐑', name: 'Sheep', file: 'sounds/sheep.mp3', color: '#39FF14' },
  ];

  const animalGridEl = document.getElementById('animal-grid');
  ANIMALS.forEach((a, i) => {
    const card = document.createElement('div');
    card.className = 'animal-card';
    card.dataset.index = i;
    card.style.setProperty('--card-color', a.color);
    card.innerHTML = `<span class="emoji">${a.emoji}</span><span class="name">${a.name}</span>`;
    animalGridEl.appendChild(card);
    a.audio = new Audio(a.file);
    a.audio.preload = 'auto';
  });

  function playAnimalSound(a) {
    a.audio.pause();
    a.audio.currentTime = 0;
    a.audio.play();
  }

  let animalResetTimer = null;

  function activateAnimal(card) {
    const a = ANIMALS[parseInt(card.dataset.index)];
    document.querySelectorAll('.animal-card.active').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    playAnimalSound(a);
    clearTimeout(animalResetTimer);
    animalResetTimer = setTimeout(() => card.classList.remove('active'), 700);
  }

  animalGridEl.addEventListener('pointerdown', e => {
    e.preventDefault();
    const card = e.target.closest('.animal-card');
    if (!card) return;
    activateAnimal(card);
  });

  </script>
</body>
</html>
