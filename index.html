<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Baby Play">
  <title>Baby Play</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    /* ── Canvas ── */
    #canvas {
      display: block;
      width: 100%; height: 100%;
      position: fixed;
      top: 0; left: 0;
    }

    /* ── Piano view ── */
    #piano-view {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #111;
      align-items: center;
      justify-content: center;
    }
    #piano-view.active { display: flex; }

    #piano {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
      padding: 0 10px;
      height: 58vh;
    }

    .white-key {
      flex: 1;
      height: 100%;
      background: #f0f0f0;
      border: 2px solid #444;
      border-radius: 0 0 12px 12px;
      margin: 0 3px;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 16px;
      transition: background 0.04s, box-shadow 0.04s;
    }

    .white-key .note-label {
      font-size: 15px;
      font-weight: 700;
      color: rgba(0,0,0,0.3);
      font-family: 'Helvetica Neue', sans-serif;
      pointer-events: none;
    }

    /* ── Animals view ── */
    #animals-view {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #111;
      align-items: center;
      justify-content: center;
    }
    #animals-view.active { display: flex; }

    .animal-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
      height: 100%;
      padding: calc(env(safe-area-inset-top) + 74px) 16px 24px;
    }

    @media (max-width: 600px) {
      .animal-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(4, 1fr);
      }
    }

    .animal-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.06);
      border: 3px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      cursor: pointer;
      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        background 0.12s ease,
        border-color 0.12s ease;
    }

    .animal-card .emoji {
      font-size: clamp(44px, 11vw, 100px);
      line-height: 1;
      pointer-events: none;
    }

    .animal-card .name {
      margin-top: 8px;
      font-family: 'Helvetica Neue', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      pointer-events: none;
    }

    .animal-card.active {
      transform: scale(1.08);
      background: var(--card-color);
      border-color: #fff;
      box-shadow: 0 0 40px var(--card-color), 0 0 15px var(--card-color);
    }
    .animal-card.active .name { color: rgba(255,255,255,0.9); }

    /* ── Menu button ── */
    #menu-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 10px);
      right: 16px;
      z-index: 1000;
      width: 46px; height: 46px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 22px;
      color: #fff;
    }

    /* ── Dropdown ── */
    #menu-dropdown {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 64px);
      right: 16px;
      z-index: 1000;
      background: rgba(25,25,25,0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      overflow: hidden;
      display: none;
      min-width: 175px;
    }
    #menu-dropdown.open { display: block; }

    .menu-item {
      padding: 15px 20px;
      color: #fff;
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:active { background: rgba(255,255,255,0.1); }
    .menu-item.selected { color: #FFD700; }
    .menu-item .icon { font-size: 18px; }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div id="piano-view">
    <div id="piano"></div>
  </div>

  <div id="animals-view">
    <div id="animal-grid" class="animal-grid"></div>
  </div>

  <div id="menu-btn">☰</div>

  <div id="menu-dropdown">
    <div class="menu-item selected" data-view="splash">
      <span class="icon">🎨</span> Color Splash
    </div>
    <div class="menu-item" data-view="piano">
      <span class="icon">🎹</span> Piano
    </div>
    <div class="menu-item" data-view="animals">
      <span class="icon">🐾</span> Animals
    </div>
  </div>

  <script type="module">
  import {
    NOTES, ANIMALS,
    BURST_THROTTLE_MS,
    Stream, Particle, Ring,
    burst, setCanvasDimensions,
  } from './app.js';

  // ════════════════════════════════════════
  //  MENU
  // ════════════════════════════════════════
  const menuBtn = document.getElementById('menu-btn');
  const menuDropdown = document.getElementById('menu-dropdown');
  let currentView = 'splash';

  menuBtn.addEventListener('click', e => {
    e.stopPropagation();
    menuDropdown.classList.toggle('open');
  });

  // Close dropdown on tap outside
  document.addEventListener('touchstart', e => {
    if (!menuBtn.contains(e.target) && !menuDropdown.contains(e.target)) {
      menuDropdown.classList.remove('open');
    }
  }, { passive: true });

  document.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('click', () => {
      switchView(item.dataset.view);
      menuDropdown.classList.remove('open');
      document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('selected'));
      item.classList.add('selected');
    });
  });

  function switchView(view) {
    currentView = view;
    const pianoView = document.getElementById('piano-view');
    const animalsView = document.getElementById('animals-view');
    const splashCanvas = document.getElementById('canvas');
    splashCanvas.style.display = view === 'splash' ? 'block' : 'none';
    pianoView.classList.toggle('active', view === 'piano');
    animalsView.classList.toggle('active', view === 'animals');
  }


  // ════════════════════════════════════════
  //  COLOR SPLASH
  // ════════════════════════════════════════
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let canvasW, canvasH;

  function resize() {
    canvasW = canvas.width = window.innerWidth;
    canvasH = canvas.height = window.innerHeight;
    setCanvasDimensions(canvasW, canvasH);
  }
  resize();
  window.addEventListener('resize', resize);

  const streams = Array.from({ length: 18 }, () => new Stream());
  let particles = [];
  let rings = [];

  const lastBurstTime = new Map();

  function handleSplashTouch(e) {
    if (currentView !== 'splash') return;
    e.preventDefault();
    const touches = e.changedTouches || [e];
    const now = Date.now();
    for (const t of touches) {
      const id = t.identifier ?? 'mouse';
      if (now - (lastBurstTime.get(id) ?? 0) < BURST_THROTTLE_MS) continue;
      lastBurstTime.set(id, now);
      const rect = canvas.getBoundingClientRect();
      // Don't burst if touching the menu area
      if (t.clientX > canvasW - 80 && t.clientY < 80) continue;
      burst(particles, rings, t.clientX - rect.left, t.clientY - rect.top);
    }
  }

  canvas.addEventListener('touchstart', handleSplashTouch, { passive: false });
  canvas.addEventListener('touchmove', handleSplashTouch, { passive: false });
  canvas.addEventListener('mousedown', handleSplashTouch);
  canvas.addEventListener('mousemove', e => { if (e.buttons) handleSplashTouch(e); });

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  function loop() {
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(0, 0, canvasW, canvasH);
    for (const s of streams) {
      s.update();
      s.draw(ctx);
    }
    rings = rings.filter(r => !r.dead());
    for (const r of rings) {
      r.update();
      r.draw(ctx);
    }
    particles = particles.filter(p => !p.dead());
    for (const p of particles) {
      p.update();
      p.draw(ctx);
    }
    requestAnimationFrame(loop);
  }
  loop();


  // ════════════════════════════════════════
  //  PIANO
  // ════════════════════════════════════════

  // iOS requires AudioContext creation AND resume inside a direct user gesture
  let audioCtx = null;

  function getAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // Unlock audio on first touch anywhere on the piano view
  document.getElementById('piano-view').addEventListener('pointerdown', () => {
    getAudio();
  }, { once: false });

  // Active notes: pointerId → { osc, gain }
  const activeNotes = new Map();

  function playNote(freq, id) {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, ac.currentTime);
    gain.gain.setValueAtTime(0, ac.currentTime);
    gain.gain.linearRampToValueAtTime(0.7, ac.currentTime + 0.02);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start();
    activeNotes.set(id, { osc, gain });
  }

  function stopNote(id) {
    const entry = activeNotes.get(id);
    if (!entry) return;
    const { osc, gain } = entry;
    const ac = getAudio();
    gain.gain.setValueAtTime(gain.gain.value, ac.currentTime);
    gain.gain.linearRampToValueAtTime(0, ac.currentTime + 0.18);
    osc.stop(ac.currentTime + 0.18);
    activeNotes.delete(id);
  }

  // Build keys
  const pianoEl = document.getElementById('piano');
  NOTES.forEach((n, i) => {
    const key = document.createElement('div');
    key.className = 'white-key';
    key.dataset.index = i;
    key.innerHTML = `<span class="note-label">${n.label}</span>`;
    pianoEl.appendChild(key);
  });

  // Track which key each pointer is currently pressing
  const pointerKeys = new Map();

  function keyDown(keyEl, pointerId) {
    if (pointerKeys.has(pointerId) && pointerKeys.get(pointerId) === keyEl) return;
    keyUp(pointerId); // release previous if sliding
    const i = parseInt(keyEl.dataset.index);
    const n = NOTES[i];
    keyEl.style.background = n.color;
    keyEl.style.boxShadow = `0 0 30px ${n.color}, 0 0 10px ${n.color}`;
    keyEl.querySelector('.note-label').style.color = 'rgba(255,255,255,0.7)';
    playNote(n.freq, pointerId);
    pointerKeys.set(pointerId, keyEl);
  }

  function keyUp(pointerId) {
    const keyEl = pointerKeys.get(pointerId);
    if (!keyEl) return;
    keyEl.style.background = '';
    keyEl.style.boxShadow = '';
    keyEl.querySelector('.note-label').style.color = '';
    stopNote(pointerId);
    pointerKeys.delete(pointerId);
  }

  pianoEl.addEventListener('pointerdown', e => {
    e.preventDefault();
    const key = e.target.closest('.white-key');
    if (!key) return;
    pianoEl.setPointerCapture(e.pointerId);
    keyDown(key, e.pointerId);
  });

  pianoEl.addEventListener('pointermove', e => {
    e.preventDefault();
    if (!pointerKeys.has(e.pointerId)) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const key = el && el.closest('.white-key');
    if (key && key !== pointerKeys.get(e.pointerId)) {
      keyDown(key, e.pointerId);
    }
  });

  pianoEl.addEventListener('pointerup', e => keyUp(e.pointerId));
  pianoEl.addEventListener('pointercancel', e => keyUp(e.pointerId));


  // ════════════════════════════════════════
  //  ANIMALS
  // ════════════════════════════════════════
  const animalGridEl = document.getElementById('animal-grid');
  ANIMALS.forEach((a, i) => {
    const card = document.createElement('div');
    card.className = 'animal-card';
    card.dataset.index = i;
    card.style.setProperty('--card-color', a.color);
    card.innerHTML = `<span class="emoji">${a.emoji}</span><span class="name">${a.name}</span>`;
    animalGridEl.appendChild(card);
    a.audio = new Audio(a.file);
    a.audio.preload = 'auto';
  });

  function playAnimalSound(a) {
    a.audio.pause();
    a.audio.currentTime = 0;
    a.audio.play();
  }

  let animalResetTimer = null;

  function activateAnimal(card) {
    const a = ANIMALS[parseInt(card.dataset.index)];
    document.querySelectorAll('.animal-card.active').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    playAnimalSound(a);
    clearTimeout(animalResetTimer);
    animalResetTimer = setTimeout(() => card.classList.remove('active'), 700);
  }

  animalGridEl.addEventListener('pointerdown', e => {
    e.preventDefault();
    const card = e.target.closest('.animal-card');
    if (!card) return;
    activateAnimal(card);
  });

  </script>
</body>
</html>
